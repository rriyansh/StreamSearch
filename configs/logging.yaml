version: 1

formatters:
  default:
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  json:
    format: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "INFO"
    formatter: "default"
    stream: "ext://sys.stdout"
  file:
    class: "logging.handlers.TimedRotatingFileHandler"
    level: "INFO"
    formatter: "json"
    filename: "logs/streamsearch.log"
    when: "D"
    backupCount: 7
    encoding: "utf-8"

loggers:
  streamsearch:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  uvicorn:
    level: "INFO"
    handlers: ["console"]
    propagate: false

root:
  level: "INFO"
  handlers: ["console"]
