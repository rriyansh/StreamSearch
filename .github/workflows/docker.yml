name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streamsearch-api:latest
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streamsearch-worker:latest
      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ui.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streamsearch-ui:latest
