version: "3.9"

networks:
  streamsearch:
    driver: bridge

volumes:
  qdrant_data:
  redis_data:
  kafka_data:
  zookeeper_data:

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ss-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - streamsearch
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - streamsearch
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ss-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - streamsearch

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ss-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - streamsearch
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ss-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SS_QDRANT_HOST: qdrant
      SS_REDIS_HOST: redis
      SS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - streamsearch
    volumes:
      - ./data/videos:/app/data/videos
      - ./data/frames:/app/data/frames
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ss-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SS_QDRANT_HOST: qdrant
      SS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - streamsearch
    volumes:
      - ./data/videos:/app/data/videos
      - ./data/frames:/app/data/frames

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: ss-ui
    restart: unless-stopped
    environment:
      STREAMLIT_SERVER_PORT: 8501
      SS_API_URL: http://api:8000
    depends_on:
      - api
    networks:
      - streamsearch
    ports:
      - "8501:8501"

  nginx:
    image: nginx:1.25-alpine
    container_name: ss-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
    networks:
      - streamsearch
