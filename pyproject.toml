[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsearch"
version = "1.0.0"
description = "Real-time multimodal video search engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StreamSearch Contributors" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "qdrant-client>=1.7",
    "kafka-python>=2.0",
    "redis>=5.0",
    "opencv-python>=4.9",
    "pillow>=10.2",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "clip @ git+https://github.com/openai/CLIP.git",
    "streamlit>=1.32",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tensorrt = ["tensorrt>=8.6", "pycuda>=2022.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
